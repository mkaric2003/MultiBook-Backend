        items: { type: array, items: { $ref: '#/components/schemas/Promotion' } }
    CreatePromotionRequest:
      type: object
      required: [name, type, value, startsAt, endsAt, minimumAmount, minimumNights]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        type: { type: string, enum: [percentage, fixedAmount, couponCode] }
        value: { type: integer, format: int64, minimum: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        code: { type: string, nullable: true }
        minimumAmount: { type: integer, format: int64, minimum: 0 }
        minimumNights: { type: integer, minimum: 0 }
        usageLimit: { type: integer, nullable: true, minimum: 1 }
    AvailableSlots:
      type: object
      required: [staff_id, appointment_date, duration_minutes, start_minutes]
      properties:
        staff_id: { type: string, format: uuid }
        appointment_date: { type: string, format: date }
        duration_minutes: { type: integer }
        start_minutes: { type: array, items: { type: integer, minimum: 0, maximum: 1410, multipleOf: 30 } }
    RescheduleAppointmentRequest:
      type: object
      required: [appointment_date, start_minutes]
      properties:
        appointment_date: { type: string, format: date }
        start_minutes: { type: integer, minimum: 0, maximum: 1410, multipleOf: 30 }
    ServiceSearchItem:
      type: object
      required: [id, owner_id, name, category_id, average_rating, review_count, lowest_price_minor]
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string }
        name: { type: string }
        category_id: { type: string }
        city: { type: string, nullable: true }
        average_rating: { type: number }
        review_count: { type: integer }
        lowest_price_minor: { type: integer, format: int64 }
    DevelopmentSeedResult:
      type: object
      required: [created]
      properties:
        created: { type: integer, minimum: 0 }
    UpdateBusinessRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        category_id: { type: string }
        short_description: { type: string, nullable: true }
        status: { type: string, enum: [active, inactive] }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Authenticated user is not allowed to perform the action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
