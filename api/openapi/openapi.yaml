openapi: 3.1.0
info:
  title: MultiBook API
  version: 1.0.0
  description: Private API consumed by the MultiBook mobile applications.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: API process is running
  /readyz:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Database connection is healthy
        '503':
          description: Database is unavailable
  /v1/users/me:
    get:
      summary: Read and provision the authenticated user profile
      security:
        - firebaseBearer: []
      responses:
        '200':
          description: Verified Firebase user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Missing or invalid Firebase ID token
    patch:
      summary: Update the authenticated user profile
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { description: Missing or invalid Firebase ID token }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/users/me/role:
    put:
      summary: Select the authenticated user's marketplace role
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  type: string
                  enum: [customer, provider]
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { description: Missing or invalid Firebase ID token }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/users/me/selected-business:
    put:
      summary: Select an owned business as the authenticated provider's active business
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_id]
              properties:
                business_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Active business selected
          content:
            application/json:
              schema:
                type: object
                required: [selected_business_id]
                properties:
                  selected_business_id: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses:
    post:
      summary: Create a business owned by the authenticated provider
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessRequest'
      responses:
        '201':
          description: Created complete business aggregate, directly decodable by Flutter BusinessModel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessModelResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      summary: List lightweight summaries of businesses owned by the authenticated provider
      security:
        - firebaseBearer: []
      responses:
        '200':
          description: Lightweight owned-business summaries for selectors, tabs and lists. Use GET /v1/businesses/{businessID} before opening the full editor.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BusinessSummaryResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/discovery/businesses:
    get:
      summary: List public businesses for discovery
      description: Customer discovery feed used by Popular Near You and the default Other businesses lists. Supplying city filters the page to that city; omitting it returns the global ranking. Results are lightweight camelCase BusinessModel-compatible cards ordered by rating and review count.
      security:
        - firebaseBearer: []
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [stays, services] }
        - name: city
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Page of popular nearby businesses
          content:
            application/json:
              schema:
                type: object
                required: [items, nextOffset]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BusinessSummaryResponse' }
                  nextOffset: { type: integer, minimum: 0 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/discovery/search:
    get:
      summary: Search public businesses by name or city
      description: Text search for customer stay and service listings. Matching uses normalized name and city prefixes.
      security:
        - firebaseBearer: []
      parameters:
        - name: type
          in: query
          required: true
          schema: { type: string, enum: [stays, services] }
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 20 }
      responses:
        '200':
          description: Matching discovery cards
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/BusinessSummaryResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/development/seed/stays:
    post:
      summary: Seed demo stay businesses in development only
      description: Provider-only and available only when APP_ENV is development. Demo cover media is a direct HTTPS URL, not a Firebase Storage path.
      security: [{ firebaseBearer: [] }]
      responses:
        '201':
          description: Demo stays created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevelopmentSeedResult' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/development/seed/services:
    post:
      summary: Seed demo service businesses in development only
      description: Provider-only and available only when APP_ENV is development. Demo cover media is a direct HTTPS URL, not a Firebase Storage path.
      security: [{ firebaseBearer: [] }]
      responses:
        '201':
          description: Demo service businesses created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevelopmentSeedResult' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/businesses/{businessID}:
    parameters:
      - name: businessID
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get the complete aggregate of an owned business for the provider editor
      security:
        - firebaseBearer: []
      responses:
        '200':
          description: Complete BusinessModel aggregate. The authenticated provider must own the business.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessModelResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      summary: Replace an owned business aggregate
      description: Uses the existing Flutter BusinessModel.toMap() camelCase payload. This is a full replacement; fetch the detail endpoint before editing so nested stay or service fields are preserved.
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBusinessRequest' }
      responses:
        '200':
          description: Replaced complete business aggregate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BusinessModelResponse' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      summary: Update editable fields of an owned business
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBusinessRequest' }
      responses:
        '200':
          description: Updated business
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Business' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Archive an owned business
      security:
        - firebaseBearer: []
      responses:
        '204': { description: Business archived }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/businesses/{businessID}/location:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
    put:
      summary: Create or replace the primary location of an owned business
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertBusinessLocationRequest' }
      responses:
        '200': { description: Saved location, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessLocation' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/dashboard-metrics:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
    get:
      summary: Get the owned business's current dashboard metrics
      description: Reads active reservations and current UTC calendar-month revenue directly from PostgreSQL reservation records. Earnings payment/staff breakdowns are intentionally excluded.
      security: [{ firebaseBearer: [] }]
      responses:
        '200':
          description: Current dashboard metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardMetrics' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/dashboard-metrics/stream:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
    get:
      summary: Stream live dashboard metrics for an owned business
      description: A Server-Sent Events stream. Emits dashboard_metrics immediately and after each committed reservation change; comment heartbeats keep idle connections alive.
      security: [{ firebaseBearer: [] }]
      responses:
        '200':
          description: Server-Sent Events containing DashboardMetrics JSON in each dashboard_metrics event
          content:
            text/event-stream:
              schema: { type: string }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/earnings:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
      - { name: endDate, in: query, required: true, schema: { type: string, format: date } }
      - { name: utcOffsetMinutes, in: query, schema: { type: integer, minimum: -840, maximum: 840, default: 0 }, description: Client UTC offset used for calendar boundaries and daily grouping }
      - { name: staffId, in: query, schema: { type: string, format: uuid } }
    get:
      summary: Get earnings metrics for an owned business and inclusive creation-date range
      description: Cash reservations contribute while confirmed or completed. Non-cash reservations additionally require paid payment status. An optional staffId filters service appointments and returns their historically stored earnings.
      security: [{ firebaseBearer: [] }]
      responses:
        '200':
          description: Earnings metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EarningsMetrics' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/earnings/stream:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
      - { name: endDate, in: query, required: true, schema: { type: string, format: date } }
      - { name: utcOffsetMinutes, in: query, schema: { type: integer, minimum: -840, maximum: 840, default: 0 }, description: Client UTC offset used for calendar boundaries and daily grouping }
      - { name: staffId, in: query, schema: { type: string, format: uuid } }
    get:
      summary: Stream live earnings metrics for an owned business and date range
      security: [{ firebaseBearer: [] }]
      responses:
        '200':
          description: Server-Sent Events containing EarningsMetrics JSON in each earnings_metrics event
          content:
            text/event-stream:
              schema: { type: string }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/promotions:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }]
    get:
      summary: List promotions for an owned business
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Promotions ordered newest first, content: { application/json: { schema: { $ref: '#/components/schemas/PromotionList' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      summary: Create a promotion for an owned business
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePromotionRequest' } } } }
      responses:
        '201': { description: Created promotion, content: { application/json: { schema: { $ref: '#/components/schemas/Promotion' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/promotions/active:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }]
    get:
      summary: Get the highest-value active automatic promotion or matching coupon
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: promo_code, in: query, schema: { type: string } }
      responses:
        '200': { description: Active promotion result, content: { application/json: { schema: { type: object, required: [promotion], properties: { promotion: { allOf: [{ $ref: '#/components/schemas/Promotion' }], nullable: true } } } } } }
  /v1/businesses/{businessID}/promotions/{promotionID}/active:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - { name: promotionID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Enable or disable an owned promotion
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [isActive], properties: { isActive: { type: boolean } } } } } }
      responses:
        '200': { description: Updated promotion, content: { application/json: { schema: { $ref: '#/components/schemas/Promotion' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/businesses/{businessID}/promotions/{promotionID}:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - { name: promotionID, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      summary: Delete an owned promotion
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Promotion deleted }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/businesses/{businessID}/media:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
    put:
      summary: Atomically replace media metadata for an owned business
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceBusinessMediaRequest' }
      responses:
        '200': { description: Saved media, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/BusinessMedia' } } } } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/stay:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
    get:
      summary: Get details of an owned stay business
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Stay details, content: { application/json: { schema: { $ref: '#/components/schemas/StayDetails' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      summary: Create or replace details of an owned stay business
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpsertStayDetailsRequest' }
      responses:
        '200': { description: Saved stay details, content: { application/json: { schema: { $ref: '#/components/schemas/StayDetails' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/stay/unit-types:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
    get:
      summary: List unit types of an owned multiple-unit stay
      security: [{ firebaseBearer: [] }]
      responses:
        '200':
          description: Stay unit types
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/StayUnitType' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      summary: Create a unit type and materialize its bookable units
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStayUnitTypeRequest' }
      responses:
        '201': { description: Created unit type, content: { application/json: { schema: { $ref: '#/components/schemas/StayUnitType' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/stay/unit-types/{unitTypeID}:
    parameters:
      - $ref: '#/components/parameters/BusinessID'
      - name: unitTypeID
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Update a unit type of an owned multiple-unit stay
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStayUnitTypeRequest' }
      responses:
        '200': { description: Updated unit type, content: { application/json: { schema: { $ref: '#/components/schemas/StayUnitType' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Archive a unit type and its materialized units
      security: [{ firebaseBearer: [] }]
      responses:
        '204': { description: Unit type archived }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/businesses/{businessID}/service:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }]
    get:
      summary: Get details of an owned service business
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Service details, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceDetails' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    put:
      summary: Create or replace details of an owned service business
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpsertServiceDetailsRequest' } } } }
      responses:
        '200': { description: Saved service details, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceDetails' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/service/offerings:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }]
    get:
      summary: List service offerings of an owned service business
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Service offerings, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOfferingList' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      summary: Create a service offering
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateServiceOfferingRequest' } } } }
      responses:
        '201': { description: Created service offering, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOffering' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/service/offerings/{offeringID}:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }, { name: offeringID, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Update a service offering
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateServiceOfferingRequest' } } } }
      responses:
        '200': { description: Updated service offering, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOffering' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Archive a service offering
      security: [{ firebaseBearer: [] }]
      responses:
        '204': { description: Service offering archived }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/businesses/{businessID}/service/staff:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }]
    get:
      summary: List staff of an owned service business
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Service staff, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStaffList' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      summary: Create a service staff member
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateServiceStaffRequest' } } } }
      responses:
        '201': { description: Created staff member, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStaff' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/service/staff/{staffID}:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }, { $ref: '#/components/parameters/StaffID' }]
    patch:
      summary: Update a service staff member
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateServiceStaffRequest' } } } }
      responses:
        '200': { description: Updated staff member, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceStaff' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Archive a service staff member
      security: [{ firebaseBearer: [] }]
      responses:
        '204': { description: Service staff archived }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/businesses/{businessID}/service/staff/{staffID}/weekly-availability:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }, { $ref: '#/components/parameters/StaffID' }]
    get:
      summary: List weekly availability intervals for a staff member
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Weekly availability, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyAvailabilityList' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      summary: Add a weekly availability interval
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateWeeklyAvailabilityRequest' } } } }
      responses:
        '201': { description: Created weekly availability, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyAvailability' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/service/staff/{staffID}/weekly-availability/{weeklyAvailabilityID}:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }, { $ref: '#/components/parameters/StaffID' }, { name: weeklyAvailabilityID, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Update a weekly availability interval
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateWeeklyAvailabilityRequest' } } } }
      responses:
        '200': { description: Updated weekly availability, content: { application/json: { schema: { $ref: '#/components/schemas/WeeklyAvailability' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Delete a weekly availability interval
      security: [{ firebaseBearer: [] }]
      responses:
        '204': { description: Weekly availability deleted }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/businesses/{businessID}/service/staff/{staffID}/availability-blocks:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }, { $ref: '#/components/parameters/StaffID' }]
    get:
      summary: List manual availability blocks for a staff member
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Availability blocks, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityBlockList' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    post:
      summary: Add a manual availability block
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAvailabilityBlockRequest' } } } }
      responses:
        '201': { description: Created availability block, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityBlock' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/service/staff/{staffID}/availability-blocks/{availabilityBlockID}:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }, { $ref: '#/components/parameters/StaffID' }, { name: availabilityBlockID, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Update a manual availability block
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateAvailabilityBlockRequest' } } } }
      responses:
        '200': { description: Updated availability block, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityBlock' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Delete a manual availability block
      security: [{ firebaseBearer: [] }]
      responses:
        '204': { description: Availability block deleted }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/businesses/{businessID}/service/appointments:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }]
    post:
      summary: Create a confirmed appointment for the authenticated customer
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateAppointmentRequest' } } } }
      responses:
        '201': { description: Confirmed appointment, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { description: Staff member is unavailable for the requested range }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/businesses/{businessID}/service/staff/{staffID}/available-slots:
    parameters: [{ $ref: '#/components/parameters/BusinessID' }, { $ref: '#/components/parameters/StaffID' }]
    get:
      summary: Return available 30-minute appointment start times for selected offerings
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: appointment_date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: offering_id
          in: query
          required: true
          explode: true
          schema: { type: array, minItems: 1, uniqueItems: true, items: { type: string, format: uuid } }
        - name: exclude_appointment_id
          in: query
          description: Appointment ignored while calculating slots during rescheduling
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Available starts, content: { application/json: { schema: { $ref: '#/components/schemas/AvailableSlots' } } } }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/appointments:
    get:
      summary: List appointments for the authenticated customer or provider
      security: [{ firebaseBearer: [] }]
      parameters:
        - name: business_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { type: string, enum: [confirmed, declined, cancelled, completed, no_show] }
      responses:
        '200': { description: Appointments, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Appointment' } } } } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
  /v1/appointments/{appointmentID}/status:
    parameters: [{ name: appointmentID, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Cancel, decline, complete, or mark an appointment as no-show
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [cancelled, declined, completed, no_show] } } } } } }
      responses:
        '200': { description: Updated appointment, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { description: Appointment cannot transition from its current state }
  /v1/appointments/{appointmentID}/reschedule:
    parameters: [{ name: appointmentID, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Reschedule a confirmed appointment
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RescheduleAppointmentRequest' } } } }
      responses:
        '200': { description: Rescheduled appointment, content: { application/json: { schema: { $ref: '#/components/schemas/Appointment' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { description: Requested appointment time is unavailable }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/services/search:
    get:
      summary: Search active service businesses, optionally constrained by a requested start time
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: city, in: query, schema: { type: string } }
        - { name: category_id, in: query, schema: { type: string } }
        - { name: min_price_minor, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: max_price_minor, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: appointment_date, in: query, schema: { type: string, format: date } }
        - { name: start_minutes, in: query, schema: { type: integer, multipleOf: 30, minimum: 0, maximum: 1410 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        '200': { description: Service results, content: { application/json: { schema: { type: object, required: [items, next_offset], properties: { items: { type: array, items: { $ref: '#/components/schemas/ServiceSearchItem' } }, next_offset: { type: integer } } } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/support-tickets:
    get:
      summary: List support tickets owned by the authenticated customer
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Offset cursor returned by the previous page. }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 30 } }
      responses:
        '200': { description: Support ticket page, content: { application/json: { schema: { $ref: '#/components/schemas/SupportTicketPage' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Create a support ticket for the authenticated customer
      description: Customer identity, name, email and initial open status are derived by the API and cannot be supplied by the client.
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSupportTicketRequest' } } } }
      responses:
        '201': { description: Created support ticket, content: { application/json: { schema: { $ref: '#/components/schemas/SupportTicket' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/payment-methods:
    get:
      summary: List saved payment method metadata for the authenticated customer
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Saved payment methods ordered newest first, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethodList' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      summary: Save non-sensitive payment method metadata
      description: Full card numbers and CVV values are never accepted or persisted.
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreatePaymentMethodRequest' } } } }
      responses:
        '201': { description: Saved payment method, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethod' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/payment-methods/{paymentMethodID}/default:
    parameters: [{ name: paymentMethodID, in: path, required: true, schema: { type: string, format: uuid } }]
    patch:
      summary: Set one owned payment method as the default
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Updated default payment method, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentMethod' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/payment-methods/{paymentMethodID}:
    parameters: [{ name: paymentMethodID, in: path, required: true, schema: { type: string, format: uuid } }]
    delete:
      summary: Delete an owned saved payment method
      security: [{ firebaseBearer: [] }]
      responses:
        '204': { description: Payment method deleted }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/conversations:
    get:
      summary: List conversations for the authenticated participant
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque keyset cursor returned by the previous page. }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 30 } }
      responses:
        '200': { description: Conversation page, content: { application/json: { schema: { $ref: '#/components/schemas/ChatConversationPage' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Get or create the unique conversation between a customer and business
      description: Customers are always derived from the authenticated identity. Providers must own the business and supply the customerId.
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GetOrCreateChatConversationRequest' } } } }
      responses:
        '200': { description: Existing or newly created conversation, content: { application/json: { schema: { $ref: '#/components/schemas/ChatConversation' } } } }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/conversations/unread-count:
    get:
      summary: Get the authenticated participant's aggregate unread message count
      security: [{ firebaseBearer: [] }]
      responses:
        '200':
          description: Unread message count
          content: { application/json: { schema: { type: object, required: [count], properties: { count: { type: integer, minimum: 0 } } } } }
  /v1/conversations/{conversationID}:
    parameters: [{ $ref: '#/components/parameters/ConversationID' }]
    get:
      summary: Get a conversation visible to the authenticated participant
      security: [{ firebaseBearer: [] }]
      responses:
        '200': { description: Conversation, content: { application/json: { schema: { $ref: '#/components/schemas/ChatConversation' } } } }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/conversations/{conversationID}/messages:
    parameters: [{ $ref: '#/components/parameters/ConversationID' }]
    get:
      summary: List conversation messages newest first
      security: [{ firebaseBearer: [] }]
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: Opaque keyset cursor returned by the previous page. }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 30 } }
      responses:
        '200': { description: Message page, content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessagePage' } } } }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      summary: Send an idempotent message
      description: The client-generated UUID makes retries safe. A UUID reused with different content returns 409.
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SendChatMessageRequest' } } } }
      responses:
        '201': { description: Created or idempotently replayed message, content: { application/json: { schema: { $ref: '#/components/schemas/ChatMessage' } } } }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { description: Message UUID was previously used with different content }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/conversations/{conversationID}/read:
    parameters: [{ $ref: '#/components/parameters/ConversationID' }]
    patch:
      summary: Mark the conversation read through its current last message
      security: [{ firebaseBearer: [] }]
      responses:
        '204': { description: Read state updated }
        '404': { $ref: '#/components/responses/NotFoundError' }
  /v1/conversations/{conversationID}/typing:
    parameters: [{ $ref: '#/components/parameters/ConversationID' }]
    put:
      summary: Set or clear the authenticated participant's short-lived typing state
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatActiveFlagRequest' } } } }
      responses:
        '204': { description: Typing state updated }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/conversations/{conversationID}/presence:
    parameters: [{ $ref: '#/components/parameters/ConversationID' }]
    put:
      summary: Set or clear active viewing state used to suppress unread and push delivery
      security: [{ firebaseBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatActiveFlagRequest' } } } }
      responses:
        '204': { description: Presence state updated }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /v1/chat/stream:
    get:
      summary: Stream authenticated chat invalidations
      description: Emits an initial chat_sync event and participant-scoped chat_changed events. Event payloads contain identifiers only; clients reload authoritative REST snapshots. Comment heartbeats keep the connection alive.
      security: [{ firebaseBearer: [] }]
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
components:
  parameters:
    BusinessID:
      name: businessID
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffID:
      name: staffID
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConversationID:
      name: conversationID
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
  schemas:
    CreateSupportTicketRequest:
      type: object
      required: [category, subject, message]
      properties:
        category: { type: string, enum: [account, booking, appointment, payment, technical, other] }
        subject: { type: string, minLength: 1, maxLength: 160 }
        message: { type: string, minLength: 1, maxLength: 5000 }
    SupportTicket:
      type: object
      required: [id, customerId, customerName, customerEmail, category, status, subject, message, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        customerId: { type: string }
        customerName: { type: string }
        customerEmail: { type: string, format: email }
        category: { type: string, enum: [account, booking, appointment, payment, technical, other] }
        status: { type: string, enum: [open, inProgress, resolved] }
        subject: { type: string, maxLength: 160 }
        message: { type: string, maxLength: 5000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SupportTicketPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/SupportTicket' } }
        nextCursor: { type: string, nullable: true }
    GetOrCreateChatConversationRequest:
      type: object
      required: [businessId]
      properties:
        businessId: { type: string, format: uuid }
        customerId: { type: string, description: Required only for an authenticated provider. }
    SendChatMessageRequest:
      type: object
      required: [id, text]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 4000 }
    ChatActiveFlagRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    ChatMessage:
      type: object
      required: [id, conversationId, senderId, text, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderId: { type: string }
        text: { type: string, maxLength: 4000 }
        createdAt: { type: string, format: date-time }
    ChatMessagePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        nextCursor: { type: string, nullable: true }
    ChatConversation:
      type: object
      required: [id, businessOwnerId, customerId, businessName, customerName, participantIds, lastMessageText, activeParticipantIds, unreadCustomerCount, unreadBusinessCount, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        businessId: { type: string, format: uuid, nullable: true }
        legacyBusinessId: { type: string, nullable: true }
        businessOwnerId: { type: string }
        customerId: { type: string }
        businessName: { type: string }
        businessImageUrl: { type: string, nullable: true, description: Stored media path or direct HTTPS URL. }
        customerName: { type: string }
        customerImageUrl: { type: string, nullable: true, description: Stored avatar path or direct HTTPS URL. }
        participantIds: { type: array, minItems: 2, maxItems: 2, items: { type: string } }
        lastMessageId: { type: string, format: uuid, nullable: true }
        lastMessageText: { type: string, maxLength: 4000 }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        lastSenderId: { type: string, nullable: true }
        typingUserId: { type: string, nullable: true }
        typingExpiresAt: { type: string, format: date-time, nullable: true }
        activeParticipantIds: { type: array, items: { type: string } }
        lastReadAtCustomer: { type: string, format: date-time, nullable: true }
        lastReadAtBusiness: { type: string, format: date-time, nullable: true }
        unreadCustomerCount: { type: integer, minimum: 0 }
        unreadBusinessCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ChatConversationPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ChatConversation' } }
        nextCursor: { type: string, nullable: true }
    User:
      type: object
      required: [id, business_currency, created_at, updated_at]
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        full_name:
          type: string
          nullable: true
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        role:
          type: string
          enum: [customer, provider, admin]
          nullable: true
        phone_e164:
          type: string
          nullable: true
          description: Phone number in E.164 format when supplied.
        avatar_storage_path:
          type: string
          nullable: true
          description: Firebase Storage path, not a download URL.
        country_code:
          type: string
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        business_currency:
          type: string
          enum: [BAM, USD, EUR, CHF, GBP]
        selected_business_id: { type: string, nullable: true }
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UpdateMyProfileRequest:
      type: object
      properties:
        first_name: { type: string }
        last_name: { type: string }
        phone_e164: { type: string }
        avatar_storage_path: { type: string }
        country_code: { type: string }
        date_of_birth: { type: string, format: date }
        address: { type: string }
        city: { type: string }
        business_currency:
          type: string
          enum: [BAM, USD, EUR, CHF, GBP]
    Business:
      type: object
      required:
        [id, owner_id, type, status, name, category_id, currency, average_rating, review_count, is_promotion_active, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
