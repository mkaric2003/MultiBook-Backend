services:
  postgres:
    image: postgis/postgis:17-3.5
    # The upstream PostGIS image currently publishes only linux/amd64 for this tag.
    # Docker Desktop runs it under emulation on Apple Silicon during local development.
    platform: linux/amd64
    environment:
      POSTGRES_DB: multibook
      POSTGRES_USER: multibook
      POSTGRES_PASSWORD: multibook
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multibook -d multibook"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro

volumes:
  postgres-data:
